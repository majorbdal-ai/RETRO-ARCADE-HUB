name: Daily Rotation

on:
  schedule:
    - cron: "0 */6 * * *"   # 4x per day: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:        # manual trigger too

permissions:
  contents: write

concurrency:
  group: daily-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # need history so the commit step can rebase onto a moving main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check rotation script
        run: node --check scripts/rotate_daily.js

      - name: Run rotation
        id: rot
        run: node scripts/rotate_daily.js

      - name: Verify live_state.json is valid + sane
        run: |
          node -e "
            const s = require('./live_state.json');
            if (!Array.isArray(s.featured) || s.featured.length === 0) throw new Error('featured missing');
            if (!s.deal || !s.deal.item) throw new Error('deal missing');
            if (!s.challenge) throw new Error('challenge missing');
            if (!Array.isArray(s.botBoost) || s.botBoost.length !== 8) throw new Error('botBoost bad');
            console.log('STATE_OK rot=' + s.rot + ' featured=' + s.featured.length + ' deal=' + s.deal.item + ' chall=' + s.challenge);
          "

      # Guards the real failure mode this workflow used to have: featured ids
      # that the app does not know about are silently dropped, so the carousel
      # would render its static fallback while the state file looked "valid".
      - name: Verify featured ids exist in app.js GAMES
        run: |
          node -e "
            const fs = require('fs');
            const app = fs.readFileSync('app.js', 'utf8');
            const state = require('./live_state.json');
            const gamesBlock = app.slice(app.indexOf('const GAMES ='), app.indexOf('];', app.indexOf('const GAMES =')));
            const ids = [...gamesBlock.matchAll(/\bid:\s*'([^']+)'/g)].map(m => m[1]);
            const unknown = state.featured.filter(id => !ids.includes(id));
            if (unknown.length) throw new Error('featured ids not in GAMES: ' + unknown.join(', '));
            console.log('FEATURED_OK ' + state.featured.join(',') + ' (GAMES: ' + ids.length + ')');
          "

      - name: Commit if changed
        run: |
          if git diff --quiet live_state.json; then
            echo "No change — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_state.json
          git commit -m "chore: daily rotation #${{ steps.rot.outputs.rot || 'auto' }}"
          # main can move between checkout and push (pages/CI commits), so retry
          # the rebase+push instead of failing the whole run on a race.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed rotation"
              exit 0
            fi
            echo "push attempt $i failed, retrying in 5s"
            sleep 5
          done
          echo "::error::could not push live_state.json after 3 attempts"
          exit 1

      - name: Verify push landed
        run: |
          git fetch origin main --quiet
          echo "Latest remote: $(git rev-parse --short origin/main)"
          node -e "
            const https = require('https');
            const remote = require('child_process').execSync('git show origin/main:live_state.json').toString();
            const r = JSON.parse(remote);
            console.log('REMOTE_STATE rot=' + r.rot + ' featured=' + r.featured.length + ' updated=' + r.updated);
            if (!Array.isArray(r.featured) || r.featured.length === 0) { console.error('::error::remote live_state.json still has no featured'); process.exit(1); }
          "
