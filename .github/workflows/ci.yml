name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check all JS
        run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f" || exit 1; done
      - name: Headless lifecycle test (66 games)
        run: node test/run_all.js
      - name: Game registry consistency check
        run: node test/consistency.js
