<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#150a24"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- neon grid -->
  <g stroke="#0ff" stroke-opacity="0.10" stroke-width="2">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="100" y1="520" x2="0" y2="630"/>
    <line x1="300" y1="520" x2="200" y2="630"/>
    <line x1="500" y1="520" x2="400" y2="630"/>
    <line x1="700" y1="520" x2="600" y2="630"/>
    <line x1="900" y1="520" x2="800" y2="630"/>
    <line x1="1100" y1="520" x2="1000" y2="630"/>
    <line x1="200" y1="520" x2="100" y2="630"/>
    <line x1="400" y1="520" x2="300" y2="630"/>
    <line x1="600" y1="520" x2="500" y2="630"/>
    <line x1="800" y1="520" x2="700" y2="630"/>
    <line x1="1000" y1="520" x2="900" y2="630"/>
    <line x1="1200" y1="520" x2="1100" y2="630"/>
  </g>
  <!-- floating icons -->
  <text x="200" y="200" font-size="90" filter="url(#glow)">🐍</text>
  <text x="850" y="170" font-size="90" filter="url(#glow)">🧩</text>
  <text x="90" y="400" font-size="90" filter="url(#glow)">🎰</text>
  <text x="1010" y="420" font-size="90" filter="url(#glow)">🏎️</text>
  <text x="560" y="180" font-size="80" filter="url(#glow)">🎮</text>
  <!-- title -->
  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="96" font-weight="900" fill="#0ff" filter="url(#glow)">RETRO ARCADE HUB</text>
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ff10f0" filter="url(#glow)">60 FREE GAMES · 6 THEMES · PLAY ON YOUR PHONE</text>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#ffe600">SNAKE · TETRIS · PINBALL · RACING · PUZZLE · SPORTS</text>
  <!-- theme swatches (6 themes) -->
  <g>
    <rect x="470" y="540" width="20" height="20" rx="4" fill="#00FFFF"/>
    <rect x="497" y="540" width="20" height="20" rx="4" fill="#A78BFA"/>
    <rect x="524" y="540" width="20" height="20" rx="4" fill="#FF6B6B"/>
    <rect x="551" y="540" width="20" height="20" rx="4" fill="#22FF88"/>
    <rect x="578" y="540" width="20" height="20" rx="4" fill="#FFD700"/>
    <rect x="605" y="540" width="20" height="20" rx="4" fill="#38BDF8"/>
  </g>
</svg>