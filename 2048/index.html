<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048</title>
  <!-- No-cache: the hub serves this inside an iframe; stale SW/browser copies
       of the pre-override page broke layout on phones (desktop-size board cut off).
       version query on the iframe src + these headers guarantee a fresh copy. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link href="style/main.css" rel="stylesheet" type="text/css">
  <!-- OVERRIDE: run AFTER main.css — fixes body margin, hides hub-redundant elements, iframe fit.
       The original 2048 responsive layout (500px/280px) is preserved EXACTLY — the board itself stays 100% original. -->
  <style>
    /* Minimal hub iframe overrides — NEVER touch .container/.game-container width
       or the original 2048 responsive layout (500px desktop / 280px mobile) breaks.
       The iframe itself is sized by the hub's frame CSS; the game's own media
       queries handle all responsive behavior perfectly. */
    html,body{margin:0!important;padding:0!important;background:#faf8ef}
    /* Hide elements the hub already provides (title, score/best, intro, how-to, restart) */
    .heading,.above-game,.game-explanation,hr,p{display:none!important}
    /* Tighten margins since original had huge gaps for hidden title/text */
    .container{padding-top:8px!important}
    .game-container{margin-top:8px!important}
    /* hide original score/best — hub coin box provides these */
    .scores-container{display:none!important}
  </style>
  <link rel="shortcut icon" href="favicon.ico">
  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1 class="title">2048</h1>
      <div class="scores-container">
        <div class="score-container">0</div>
        <div class="best-container">0</div>
      </div>
    </div>

    <div class="above-game">
      <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
      <a class="restart-button">New Game</a>
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
          <a class="keep-playing-button">Keep going</a>
          <a class="retry-button">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container">

      </div>
    </div>

    <p class="game-explanation">
      <strong class="important">How to play:</strong> Use your <strong>arrow keys</strong> to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong>
    </p>
  </div>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
